# Signal names follow the metric columns in the corresponding RCAEval RE1-TT cases.
# Values, thresholds, and source timestamps are not imported; episode timing is authored.
# See the example README for the metric-family mapping and source attribution.
scenario_id: 12-rcaeval-re1-train-ticket
version: '0.1'
incidents:
- incident_template_id: rcaeval-cpu-pressure
  reference_incident_id: incident-auth-cpu
  target:
    application: train-ticket
  start:
    distribution: fixed
    seconds: 100
  alerts:
  - role: cpu
    alertname: SyntheticMetricCPU
    namespace: rcaeval-train-ticket
    labels:
      application: train-ticket
      metric: ts-auth-service_cpu
      metric_family: cpu
      service: ts-auth-service
      severity: warning
