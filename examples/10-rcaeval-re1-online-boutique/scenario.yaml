# Signal names follow the metric columns in the corresponding RCAEval RE1-OB cases.
# Values, thresholds, and source timestamps are not imported; episode timing is authored.
# See the example README for the metric-family mapping and source attribution.
scenario_id: 10-rcaeval-re1-online-boutique
version: '0.1'
incidents:
- incident_template_id: rcaeval-cpu-pressure
  reference_incident_id: incident-adservice-cpu
  target:
    application: online-boutique
  start:
    distribution: fixed
    seconds: 100
  alerts:
  - role: cpu
    alertname: SyntheticMetricCPU
    namespace: rcaeval-online-boutique
    labels:
      application: online-boutique
      metric: adservice_cpu
      metric_family: cpu
      service: adservice
      severity: warning
    delay:
      distribution: fixed
      seconds: 0
    duration:
      distribution: fixed
      seconds: 180
    observation_delay_seconds: 5
  - role: load
    alertname: SyntheticMetricLoad
    namespace: rcaeval-online-boutique
