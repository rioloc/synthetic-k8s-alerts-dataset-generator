# 200 explicit alert episodes / 41 oracle incidents across two fictitious clusters.
# Fault combinations and timing are authored synthetic assumptions, not production statistics.
# AI-assisted authoring; see ../README.md for the v1 manifest/card provenance limitation.
# No PromQL evaluation, alert-inhibition simulation, live systems, or external data at runtime.
# OpenShift release-4.18 rule baseline (immutable commits):
# https://github.com/openshift/cluster-monitoring-operator/tree/83ca2e8cd96f4edf1cf709f9b9da6b0ec1d67db8/assets
# https://github.com/openshift/cluster-etcd-operator/blob/3af8b9d6ceb707462af67ebbda92ec4c2b341d81/manifests/0000_90_etcd-operator_03_prometheusrule.yaml
# Sources, rule-specific caveats, partition sizes, and usage: ../README.md, section 09.
scenario_id: 09-openshift-alert-storm
version: '0.1'
incidents:
- incident_template_id: node-outage-flapping
  reference_incident_id: incident-node-01
  target:
    cluster: synthetic-east
    node: worker-01
  start:
    distribution: uniform
    min_seconds: 0
    max_seconds: 300
  alerts:
  - role: node-unready-first
    alertname: KubeNodeNotReady
    namespace: openshift-monitoring
    labels:
      cluster: synthetic-east
      severity: warning
      node: worker-01
      job: kube-state-metrics
    delay:
      distribution: uniform
      min_seconds: 900
      max_seconds: 1100
    duration:
      distribution: uniform
      min_seconds: 900
      max_seconds: 1500
    observation_delay_seconds: 15
  - role: node-unreachable
    alertname: KubeNodeUnreachable
    namespace: openshift-monitoring
    labels:
      cluster: synthetic-east
      severity: warning
      node: worker-01
      job: kube-state-metrics
    delay:
      distribution: uniform
      min_seconds: 960
      max_seconds: 1260
    duration:
      distribution: uniform
      min_seconds: 900
      max_seconds: 1800
    observation_delay_seconds: 45
  - role: pod-unknown-first
    alertname: KubePodNotReady
    namespace: default
    labels:
      cluster: synthetic-east
      severity: warning
      pod: worker-agent-01-a
    delay:
      distribution: uniform
      min_seconds: 1000
      max_seconds: 1300
    duration:
      distribution: lognormal
      median_seconds: 2100
      sigma: 0.25
    observation_delay_seconds: 90
  - role: node-unready-again
    alertname: KubeNodeNotReady
    namespace: openshift-monitoring
    labels:
      cluster: synthetic-east
      severity: warning
      node: worker-01
      job: kube-state-metrics
    delay:
      distribution: fixed
      seconds: 4200
    duration:
      distribution: uniform
      min_seconds: 900
      max_seconds: 1500
    observation_delay_seconds: 15
  - role: pod-unknown-second
    alertname: KubePodNotReady
    namespace: default
    labels:
      cluster: synthetic-east
      severity: warning
      pod: worker-agent-01-b
    delay:
      distribution: uniform
      min_seconds: 1050
      max_seconds: 1350
    duration:
      distribution: lognormal
      median_seconds: 1800
      sigma: 0.3
    observation_delay_seconds: 120
