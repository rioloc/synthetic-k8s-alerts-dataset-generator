# Signal names follow the metric columns in the corresponding RCAEval RE1-SS cases.
# Values, thresholds, and source timestamps are not imported; episode timing is authored.
# See the example README for the metric-family mapping and source attribution.
scenario_id: 11-rcaeval-re1-sock-shop
version: '0.1'
incidents:
- incident_template_id: rcaeval-cpu-pressure
  reference_incident_id: incident-carts-cpu
  target:
    application: sock-shop
  start:
    distribution: fixed
    seconds: 100
  alerts:
  - role: cpu
    alertname: SyntheticMetricCPU
    namespace: rcaeval-sock-shop
    labels:
      application: sock-shop
      metric: carts_cpu
      metric_family: cpu
      service: carts
      severity: warning
    delay:
      distribution: fixed
      seconds: 0
    duration:
      distribution: fixed
      seconds: 180
    observation_delay_seconds: 5
  - role: database-cpu
    alertname: SyntheticMetricCPU
    namespace: rcaeval-sock-shop
    labels:
      application: sock-shop
      metric: carts-db_cpu
      metric_family: cpu
      service: carts-db
      severity: warning
    delay:
      distribution: fixed
      seconds: 15
    duration:
      distribution: fixed
      seconds: 150
    observation_delay_seconds: 8
  - role: latency
    alertname: SyntheticMetricLatency
    namespace: rcaeval-sock-shop
    labels:
      application: sock-shop
      metric: carts_latency-90
      metric_family: latency
      service: carts
      severity: warning
    delay:
      distribution: fixed
      seconds: 30
    duration:
      distribution: fixed
      seconds: 120
    observation_delay_seconds: 12
  - role: error
