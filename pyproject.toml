[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-alert-dataset-generator"
version = "0.1.0"
description = "Deterministic, standalone synthetic alert-episode datasets"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
visualization = ["matplotlib>=3.10,<4"]

[project.scripts]
generator = "generator.__main__:main"

[tool.setuptools.packages.find]
include = ["generator*"]
